<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ecebf3">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Senti - Finance Tracker</title>
  <title>Senti</title>
<link rel="icon" type="image/svg+xml" href="assets/sentisvg.svg">

  <!-- Must stay first and blocking: sets data-theme before first paint. -->
  <script src="js/theme-boot.js"></script>

  <link rel="preload" href="assets/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<!-- data-auth: "loading" until the app knows whether you are signed in, then "in" or "out". -->
<body data-auth="loading">
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="shell">
    <!-- Sidebar on desktop, floating bottom pill on phones. -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-name">Finance Tracker</span>
      </div>

      <nav class="nav" aria-label="Primary">
        <a href="#overview" class="nav-link" data-route="overview">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#home"></use></svg>
          <span>Home</span>
        </a>
        <a href="#ledger" class="nav-link" data-route="ledger">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#list"></use></svg>
          <span>Ledger</span>
        </a>
        <a href="#scan" class="nav-link" data-route="scan">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#camera"></use></svg>
          <span>Scan</span>
        </a>
        <a href="#insights" class="nav-link" data-route="insights">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#chart"></use></svg>
          <span>Insights</span>
        </a>
        <a href="#scores" class="nav-link" data-route="scores">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#gauge"></use></svg>
          <span>Scores</span>
        </a>
      </nav>

      <div class="sidebar-actions">
        <button type="button" id="add-btn" class="btn btn-primary">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#plus"></use></svg>
          <span>Add</span>
        </button>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <h1 id="page-title" class="page-title">Home</h1>
        <div id="topbar-controls" class="topbar-controls"></div>
        <span id="conn-status" class="conn" data-state="unknown">Checking…</span>
        <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch theme">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#contrast"></use></svg>
        </button>
        <button type="button" id="sign-out" class="icon-btn" aria-label="Sign out">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#logout"></use></svg>
        </button>
      </header>

      <!-- Each screen gets its own container inside here. tabindex lets the router move focus here. -->
      <main id="view" class="content" tabindex="-1"></main>
    </div>
  </div>

  <!-- One shared sheet (modal on desktop, bottom sheet on phones); views fill it. -->
  <dialog id="sheet" class="sheet"></dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="route-announcer" class="visually-hidden" aria-live="polite"></div>

  <noscript>This app needs JavaScript to run.</noscript>

  <script src="js/config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
